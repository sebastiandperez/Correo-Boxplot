[package]
name = "correo-boxplot"
version = "0.1.0"
description = "Local-first desktop mail client"
edition = "2024"
rust-version = "1.97.1"
default-run = "correo-boxplot"

[lib]
name = "correo_boxplot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
conformance = []
local-env-doctor = []
e2ee-dev-tool = []

[[bin]]
name = "local-env-doctor"
path = "src/bin/local_env_doctor.rs"
required-features = ["local-env-doctor"]

[[bin]]
name = "e2ee-key-tool"
path = "src/bin/e2ee_key_tool.rs"
required-features = ["e2ee-dev-tool"]

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.3"
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.20"
getrandom = "=0.4.3"
keyring-core = "=1.0.0"
zeroize = "=1.9.0"
base64 = "=0.22.1"
libsodium-rs = "=0.2.4"
mail-parser = { version = "=0.11.8", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.0", default-features = false, features = ["crypto-rust"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"

[patch.crates-io]
libsqlite3-sys = { path = "../vendor/libsqlite3-sys-0.38.2-sqlcipher-4.17" }
