[package]
name = "correo-boxplot"
version = "0.1.0"
description = "Local-first desktop mail client"
edition = "2024"
rust-version = "1.97.1"
default-run = "correo-boxplot"

[lib]
name = "correo_boxplot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
conformance = []
local-env-doctor = []

[[bin]]
name = "local-env-doctor"
path = "src/bin/local_env_doctor.rs"
required-features = ["local-env-doctor"]

[dependencies]
tauri = { version = "=2.11.5", features = [] }
rusqlite = { version = "=0.40.2", features = ["sqlcipher"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.20"
getrandom = "=0.4.3"
keyring-core = "=1.0.0"
zeroize = "=1.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.0", default-features = false, features = ["crypto-rust"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"
